[workspace]
members = ["crates/core", "crates/collector", "crates/platforms", "crates/alerts", "crates/mcp-server", "crates/cli", "crates/history"]
resolver = "3"
exclude = ["vendor/glib-0.18.5"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.1"
